<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消元与逆矩阵</title>
<style>
  :root {
    --input: #2F6FE0; --comp1: #E8743B; --comp2: #0E96B8; --output: #8E44AD;
    --state: #E9A913; --bad: #D64545; --good: #3E9B3A; --neutral: #9AA6B6;
    --light: #E7ECF3; --bg: #FFFFFF; --text: #1F2937;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 15px; }
  main { padding: 20px; max-width: 1180px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: #5b6573; font-size: 13px; margin: 0 0 12px; line-height: 1.6; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .card { border: 1px solid var(--light); border-radius: 8px; padding: 12px 14px; }
  .lab { text-align: center; font-weight: bold; margin-bottom: 4px; font-family: "Cambria Math", serif; }
  table.m { border-collapse: separate; border-spacing: 3px; font-family: "Cambria Math", serif; font-size: 19px;
            border-left: 2px solid var(--text); border-right: 2px solid var(--text); border-radius: 4px; }
  table.m td { min-width: 50px; height: 40px; padding: 2px 6px; text-align: center; border-radius: 5px; }
  table.m td.bar { border-left: 2px solid var(--text); border-radius: 0; }
  table.m input { width: 46px; font: 18px "Cambria Math", serif; text-align: center; border: 1px solid var(--light);
                  border-radius: 4px; background: transparent; }
  table.s { font-size: 15px; }
  table.s td { min-width: 38px; height: 30px; }
  .chg { background: rgba(142,68,173,0.18); }
  .piv { outline: 2.5px solid var(--state); outline-offset: -3px; }
  .zero { background: rgba(214,69,69,0.25); }
  button { font: inherit; padding: 4px 10px; margin: 2px 4px 2px 0; border: 1px solid var(--neutral);
           background: #fff; border-radius: 6px; cursor: pointer; }
  button:hover { background: var(--light); }
  button:disabled { opacity: 0.4; cursor: default; }
  #steptext { min-height: 48px; margin-top: 10px; color: var(--output); font-size: 16px; }
  #status { margin-top: 6px; min-height: 22px; }
  .bad { color: var(--bad); } .good { color: var(--good); }
  .num { font-family: "Cambria Math", "Times New Roman", serif; }
  math { font-size: 17px; }
</style>
</head>
<body>
<main>
  <h1>消元与逆矩阵</h1>
  <p class="hint">左边是增广矩阵：竖线左边是要求逆的矩阵，右边是单位矩阵 I。每按一次"下一步"做一步行变换（高斯-若尔当消元）：先向下消元，再向上消元并把主元除成 1。紫色是这一步改写的一行，琥珀色框是主元，红色是这一步消成 0 的位置。右边显示这一步左乘的矩阵，以及到目前为止所有步骤乘起来的矩阵 Y。上面三行三列的数可以直接修改。</p>
  <div class="row">
    <div class="card">
      <div class="lab">要求逆的矩阵（可修改）</div>
      <table class="m" id="tIn"></table>
      <div style="margin-top:8px">
        <button id="exM">本篇的 M</button><button id="exSwap">主元位置是 0</button><button id="exSing">不可逆</button>
      </div>
      <div style="margin-top:6px">
        <button id="prev">上一步</button><button id="next">下一步</button><button id="reset">从头开始</button>
        <span id="counter" class="num" style="margin-left:8px"></span>
      </div>
      <div id="steptext" class="num"></div>
      <div id="status"></div>
    </div>
    <div class="card">
      <div class="lab">当前的增广矩阵</div>
      <table class="m" id="tAug"></table>
      <p class="hint" style="margin:10px 0 0">若把所有步骤乘起来的矩阵记作 Y，那么当前的增广矩阵就是</p>
      <math display="block"><mrow><mi mathvariant="bold">Y</mi><mo>[</mo><mi mathvariant="bold">G</mi><mo>|</mo><mi mathvariant="bold">I</mi><mo>]</mo><mo>=</mo><mo>[</mo><mi mathvariant="bold">Y</mi><mi mathvariant="bold">G</mi><mo>|</mo><mi mathvariant="bold">Y</mi><mo>]</mo></mrow></math>
      <p class="hint" style="margin:4px 0 0">左边消成 I 时，<math><mrow><mi mathvariant="bold">Y</mi><mi mathvariant="bold">G</mi><mo>=</mo><mi mathvariant="bold">I</mi></mrow></math>，右边的 Y 就是逆矩阵。</p>
    </div>
    <div class="card">
      <div class="row">
        <div><div class="lab">这一步左乘的矩阵</div><table class="m s" id="tStep"></table></div>
        <div><div class="lab">Y（到目前为止的乘积）</div><table class="m s" id="tX"></table></div>
      </div>
      <div id="check" class="hint" style="margin-top:10px"></div>
    </div>
  </div>
</main>
<script>
"use strict";
// ---- 分数 ----
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
function fr(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; }
const add = (x, y) => fr(x[0] * y[1] + y[0] * x[1], x[1] * y[1]);
const sub = (x, y) => fr(x[0] * y[1] - y[0] * x[1], x[1] * y[1]);
const mulf = (x, y) => fr(x[0] * y[0], x[1] * y[1]);
const divf = (x, y) => fr(x[0] * y[1], x[1] * y[0]);
const isZero = x => x[0] === 0;
const isOne = x => x[0] === 1 && x[1] === 1;
function show(x) { const s = x[1] === 1 ? String(x[0]) : x[0] + "/" + x[1]; return s.replace("-", "−"); }
function eye(n) { return Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => fr(i === j ? 1 : 0))); }
function matmul(A, B) {
  return A.map(r => B[0].map((_, j) => r.reduce((acc, a, k) => add(acc, mulf(a, B[k][j])), fr(0))));
}

const PRESETS = {
  M: [[1, 1, 1], [2, 4, 2], [3, 5, 4]],
  swap: [[0, 2, 1], [1, 1, 1], [2, 1, 3]],
  sing: [[1, 1, 1], [2, 2, 2], [1, 3, 4]],
};
let G = PRESETS.M.map(r => r.slice());
let steps = [];   // 每一步：{ aug, E, X, text, row, piv, zeros, fail }
let k = 0;

function buildSteps() {
  const n = 3;
  let aug = G.map((r, i) => r.map(v => fr(v)).concat(eye(n)[i]));
  let X = eye(n);
  steps = [{ aug: aug.map(r => r.slice()), E: null, X, text: "把单位矩阵 I 接在右边。", row: null, piv: [], zeros: [] }];
  const pivots = [];
  const push = (E, text, row, piv, zeros) => {
    aug = matmul(E, aug);
    X = matmul(E, X);
    steps.push({ aug: aug.map(r => r.slice()), E, X, text, row, piv, zeros });
  };
  // 向下消元
  for (let j = 0, r = 0; j < n; j++) {
    let p = r;
    while (p < n && isZero(aug[p][j])) p++;
    if (p === n) {
      steps.push({ aug: aug.map(rr => rr.slice()), E: null, X, row: null, piv: pivots.slice(), zeros: [],
                   text: `第 ${j + 1} 列在主元位置和它下面都是 0，找不到主元。`, fail: true });
      return;
    }
    if (p !== r) {
      const E = eye(n); E[r][r] = fr(0); E[p][p] = fr(0); E[r][p] = fr(1); E[p][r] = fr(1);
      push(E, `第 ${r + 1} 行第 ${j + 1} 列是 0，交换第 ${r + 1} 行和第 ${p + 1} 行（左乘置换矩阵）。`, null, pivots.concat([[r, j]]), []);
    }
    pivots.push([r, j]);
    for (let i = r + 1; i < n; i++) {
      if (isZero(aug[i][j])) continue;
      const m = divf(aug[i][j], aug[r][j]);
      const E = eye(n); E[i][r] = sub(fr(0), m);
      push(E, `乘数 ${show(aug[i][j])} ÷ ${show(aug[r][j])} = ${show(m)}：第 ${i + 1} 行 − ${show(m)} × 第 ${r + 1} 行。`, i, pivots.slice(), [[i, j]]);
    }
    r++;
  }
  // 向上消元，并把主元除成 1
  for (let j = n - 1; j >= 0; j--) {
    if (!isOne(aug[j][j])) {
      const d = aug[j][j];
      const E = eye(n); E[j][j] = divf(fr(1), d);
      push(E, `第 ${j + 1} 行除以主元 ${show(d)}（左乘对角矩阵）。`, j, pivots.slice(), []);
    }
    for (let i = j - 1; i >= 0; i--) {
      if (isZero(aug[i][j])) continue;
      const m = aug[i][j];
      const E = eye(n); E[i][j] = sub(fr(0), m);
      push(E, `用第 ${j + 1} 行的主元消掉第 ${i + 1} 行第 ${j + 1} 列：第 ${i + 1} 行 − ${show(m)} × 第 ${j + 1} 行。`, i, pivots.slice(), [[i, j]]);
    }
  }
  steps[steps.length - 1].done = true;
}

function renderInput() {
  const t = document.getElementById("tIn");
  t.innerHTML = "";
  G.forEach((r, i) => {
    const tr = t.insertRow();
    r.forEach((v, j) => {
      const td = tr.insertCell();
      const inp = document.createElement("input");
      inp.value = v; inp.type = "text";
      inp.addEventListener("change", () => {
        const x = parseInt(inp.value, 10);
        G[i][j] = Number.isFinite(x) ? x : 0;
        inp.value = G[i][j];
        buildSteps(); k = 0; render();
      });
      td.appendChild(inp);
    });
  });
}

function fill(id, Mx, opts = {}) {
  const t = document.getElementById(id);
  t.innerHTML = "";
  if (!Mx) { const tr = t.insertRow(); const td = tr.insertCell(); td.textContent = "—"; return; }
  Mx.forEach((r, i) => {
    const tr = t.insertRow();
    r.forEach((v, j) => {
      const td = tr.insertCell();
      td.textContent = show(v);
      if (opts.bar !== undefined && j === opts.bar) td.classList.add("bar");
      if (opts.row === i) td.classList.add("chg");
      if ((opts.piv || []).some(([a, b]) => a === i && b === j)) td.classList.add("piv");
      if ((opts.zeros || []).some(([a, b]) => a === i && b === j)) td.classList.add("zero");
    });
  });
}

function render() {
  const st = steps[k];
  fill("tAug", st.aug, { bar: 3, row: st.row, piv: st.piv, zeros: st.zeros });
  fill("tStep", st.E);
  fill("tX", st.X);
  document.getElementById("counter").textContent = `第 ${k} 步，共 ${steps.length - 1} 步`;
  document.getElementById("steptext").textContent = st.text;
  const status = document.getElementById("status");
  const last = steps[steps.length - 1];
  if (st.fail) status.innerHTML = '<span class="bad">消元找不到 3 个主元，这个矩阵不可逆。</span>';
  else if (st.done) status.innerHTML = '<span class="good">左边已是单位矩阵，右边三列就是逆矩阵。</span>';
  else status.textContent = last.fail ? "（这个矩阵在后面会找不到主元）" : "";
  // 核对：Y 乘原矩阵等于当前左边三列
  const XG = matmul(st.X, G.map(r => r.map(v => fr(v))));
  const ok = XG.every((r, i) => r.every((v, j) => v[0] === st.aug[i][j][0] && v[1] === st.aug[i][j][1]));
  document.getElementById("check").textContent = ok ? "核对：Y 乘原来的矩阵，正好等于当前增广矩阵竖线左边的三列。" : "核对失败";
  document.getElementById("prev").disabled = k === 0;
  document.getElementById("next").disabled = k === steps.length - 1;
}

document.getElementById("next").onclick = () => { if (k < steps.length - 1) { k++; render(); } };
document.getElementById("prev").onclick = () => { if (k > 0) { k--; render(); } };
document.getElementById("reset").onclick = () => { k = 0; render(); };
const load = key => { G = PRESETS[key].map(r => r.slice()); renderInput(); buildSteps(); k = 0; render(); };
document.getElementById("exM").onclick = () => load("M");
document.getElementById("exSwap").onclick = () => load("swap");
document.getElementById("exSing").onclick = () => load("sing");
renderInput(); buildSteps(); render();
</script>
</body>
</html>
