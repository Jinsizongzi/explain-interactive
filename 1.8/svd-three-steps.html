<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三步分解</title>
<style>
  :root {
    --input: #2F6FE0; --comp1: #E8743B; --comp2: #0E96B8; --output: #8E44AD;
    --state: #E9A913; --bad: #D64545; --good: #3E9B3A; --neutral: #9AA6B6;
    --light: #E7ECF3; --bg: #FFFFFF; --text: #1F2937;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 15px; }
  main { display: flex; gap: 24px; padding: 20px; flex-wrap: wrap; align-items: flex-start; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: #5b6573; font-size: 13px; margin: 0 0 12px; max-width: 620px; }
  svg { border: 1px solid var(--light); border-radius: 8px; user-select: none; }
  .panel { flex: 1; min-width: 380px; max-width: 560px; }
  .card { border: 1px solid var(--light); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; gap: 10px; }
  .label { color: #5b6573; }
  .num { font-family: "Cambria Math", "Times New Roman", serif; font-size: 17px; }
  .big { font-size: 20px; font-weight: bold; }
  .c1 { color: var(--comp1); } .c2 { color: var(--comp2); } .o { color: var(--output); }
  .good { color: var(--good); } .st { color: var(--state); }
  button { font: inherit; padding: 5px 12px; margin: 2px 4px 2px 0; border: 1px solid var(--neutral);
           background: #fff; border-radius: 6px; cursor: pointer; }
  button:hover { background: var(--light); }
  button.on { background: var(--light); border-color: var(--output); font-weight: bold; }
  input[type=range] { width: 200px; vertical-align: middle; }
  table.m { border-collapse: collapse; font-family: "Cambria Math", serif; font-size: 16px;
            border-left: 2px solid var(--text); border-right: 2px solid var(--text); }
  table.m td { padding: 3px 10px; text-align: center; }
  .mats { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .vec { display: inline-flex; align-items: stretch; vertical-align: middle; margin: 0 2px;
         line-height: 1.15; }
  .vec .col { display: flex; flex-direction: column; justify-content: center; text-align: center;
              padding: 0 2px; }
  .vec .br { width: 4px; border-top: 1.2px solid currentColor;
             border-bottom: 1.2px solid currentColor; }
  .vec .br.l { border-left: 1.2px solid currentColor; }
  .vec .br.r { border-right: 1.2px solid currentColor; }
</style>
</head>
<body>
<main>
  <div>
    <h1>三步分解</h1>
    <p class="hint">四个按钮依次显示单位圆、乘 Vᵀ 以后、再乘 Σ 以后、再乘 U 以后的图形。
      虚线圆是原来的单位圆，紫色曲线是当前图形，橙色和青色箭头是两个方向走到这一步的位置。
      两个奇异值可以用滑块改（σ₂ 不会超过 σ₁）；把 σ₂ 调成 0，最后的图形会压成一条线段。小数是约数，末位可能差 1。</p>
    <svg id="plane" width="560" height="560" viewBox="0 0 560 560"></svg>
  </div>
  <div class="panel">
    <div class="card">
      <div>
        <button id="s0" class="on">① 单位圆</button>
        <button id="s1">② 乘 Vᵀ</button>
        <button id="s2">③ 再乘 Σ</button>
        <button id="s3">④ 再乘 U</button>
      </div>
      <div class="row" style="margin-top:8px"><span class="label c1">奇异值 σ₁</span>
        <span><input type="range" id="r1" min="0" max="6" step="0.5" value="4">
          <span class="num big c1" id="r1v"></span></span></div>
      <div class="row"><span class="label c2">奇异值 σ₂</span>
        <span><input type="range" id="r2" min="0" max="6" step="0.5" value="1">
          <span class="num big c2" id="r2v"></span></span></div>
      <div style="margin-top:6px"><button id="pB">预设回 B = [2 0; 3 2]（σ₁ = 4、σ₂ = 1）</button></div>
    </div>
    <div class="card">
      <div class="label" style="margin-bottom:6px">这一步在做什么</div>
      <div class="num" id="what" style="font-size:16px"></div>
      <div class="row" style="margin-top:8px"><span class="label c1">橙色箭头现在指向</span>
        <span class="num c1" id="a1"></span></div>
      <div class="row"><span class="label c2">青色箭头现在指向</span>
        <span class="num c2" id="a2"></span></div>
    </div>
    <div class="card">
      <div class="mats">
        <div>
          <div class="label" style="margin-bottom:4px">U</div>
          <table class="m"><tr><td class="c1" id="u11"></td><td class="c2" id="u12"></td></tr>
                           <tr><td class="c1" id="u21"></td><td class="c2" id="u22"></td></tr></table>
        </div>
        <div>
          <div class="label" style="margin-bottom:4px">Σ</div>
          <table class="m"><tr><td class="c1" id="g11"></td><td>0</td></tr>
                           <tr><td>0</td><td class="c2" id="g22"></td></tr></table>
        </div>
        <div>
          <div class="label" style="margin-bottom:4px">Vᵀ</div>
          <table class="m"><tr><td id="v11"></td><td id="v12"></td></tr>
                           <tr><td id="v21"></td><td id="v22"></td></tr></table>
        </div>
      </div>
      <div class="row" style="margin-top:8px"><span class="label">第一步转的角度</span>
        <span class="num" id="angV"></span></div>
      <div class="row"><span class="label">第三步转的角度</span><span class="num" id="angU"></span></div>
    </div>
    <div class="card">
      <div class="label" style="margin-bottom:6px">U Σ Vᵀ 乘出来的矩阵</div>
      <div class="mats">
        <div>
          <table class="m"><tr><td class="o" id="p11"></td><td class="o" id="p12"></td></tr>
                           <tr><td class="o" id="p21"></td><td class="o" id="p22"></td></tr></table>
        </div>
        <div>
          <div class="row"><span class="label">σ₁ σ₂ 与 |行列式|</span><span class="num good" id="chk1"></span></div>
          <div class="row"><span class="label">σ₁² + σ₂² 与元素平方和</span><span class="num good" id="chk2"></span></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
  "use strict";
  var C = { comp1: "#E8743B", comp2: "#0E96B8", output: "#8E44AD", neutral: "#9AA6B6",
            light: "#E7ECF3", input: "#2F6FE0" };
  var NS = "http://www.w3.org/2000/svg";
  var SIZE = 560, O = SIZE / 2, RANGE = 6.5, UNIT = O / RANGE;
  var svg = document.getElementById("plane");
  var step = 0;
  // B = [2 0; 3 2] 的两条方向：v₁ = (2,1)/√5、u₁ = (1,2)/√5
  var thV = Math.atan2(1, 2), thU = Math.atan2(2, 1);

  function px(x, y) { return [O + UNIT * x, O - UNIT * y]; }
  function el(tag, at) {
    var e = document.createElementNS(NS, tag);
    for (var k in at) e.setAttribute(k, at[k]);
    return e;
  }
  function line(x1, y1, x2, y2, col, w, dash) {
    var a = px(x1, y1), b = px(x2, y2);
    var e = el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: col, "stroke-width": w });
    if (dash) e.setAttribute("stroke-dasharray", dash);
    svg.appendChild(e);
  }
  function arrow(v, col, w) {
    if (Math.hypot(v[0], v[1]) < 1e-9) return;
    var a = px(0, 0), b = px(v[0], v[1]);
    var th = Math.atan2(b[1] - a[1], b[0] - a[0]), h = 11;
    svg.appendChild(el("line", { x1: a[0], y1: a[1], x2: b[0] - h * Math.cos(th),
      y2: b[1] - h * Math.sin(th), stroke: col, "stroke-width": w }));
    var p = [b, [b[0] + h * Math.cos(th + 2.7), b[1] + h * Math.sin(th + 2.7)],
             [b[0] + h * Math.cos(th - 2.7), b[1] + h * Math.sin(th - 2.7)]];
    svg.appendChild(el("polygon", { points: p.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" "), fill: col }));
  }
  function path(pts, col, w, dash) {
    var d = "M " + pts.map(function (p) { var q = px(p[0], p[1]); return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L ");
    var e = el("path", { d: d, fill: "none", stroke: col, "stroke-width": w });
    if (dash) e.setAttribute("stroke-dasharray", dash);
    svg.appendChild(e);
  }
  function text(x, y, s, col, size) {
    var p = px(x, y);
    var e = el("text", { x: p[0], y: p[1], fill: col, "font-size": size || 11,
      "font-family": "Cambria Math, serif", "text-anchor": "middle" });
    e.textContent = s;
    svg.appendChild(e);
  }
  function fmt(v, n) {
    var s = (Math.abs(v) < 5e-5 ? 0 : v).toFixed(n === undefined ? 3 : n);
    return s.replace("-", "−");
  }
  function vs(v) {
    return '<span class="vec"><span class="br l"></span><span class="col"><span>' +
      fmt(v[0]) + '</span><span>' + fmt(v[1]) +
      '</span></span><span class="br r"></span></span>';
  }

  function sig() {
    // 奇异值按从大到小排，所以把 σ₂ 夹在 σ₁ 以下
    var a = +document.getElementById("r1").value;
    var b = Math.min(+document.getElementById("r2").value, a);
    return [a, b];
  }
  function mats() {
    var s = sig();
    var cv = Math.cos(thV), sv = Math.sin(thV), cu = Math.cos(thU), su = Math.sin(thU);
    var V = [[cv, -sv], [sv, cv]];          // 两列是 v₁、v₂
    var VT = [[cv, sv], [-sv, cv]];
    var U = [[cu, -su], [su, cu]];
    var S = [[s[0], 0], [0, s[1]]];
    return { V: V, VT: VT, U: U, S: S, s: s };
  }
  function mm(A, B) {
    return [[A[0][0] * B[0][0] + A[0][1] * B[1][0], A[0][0] * B[0][1] + A[0][1] * B[1][1]],
            [A[1][0] * B[0][0] + A[1][1] * B[1][0], A[1][0] * B[0][1] + A[1][1] * B[1][1]]];
  }
  function mv(A, v) { return [A[0][0] * v[0] + A[0][1] * v[1], A[1][0] * v[0] + A[1][1] * v[1]]; }

  function draw() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var m = mats();
    for (var k = -6; k <= 6; k++) {
      line(k, -RANGE, k, RANGE, C.light, 1);
      line(-RANGE, k, RANGE, k, C.light, 1);
    }
    line(-RANGE, 0, RANGE, 0, C.neutral, 1.5);
    line(0, -RANGE, 0, RANGE, C.neutral, 1.5);
    for (var k2 = -6; k2 <= 6; k2 += 2) if (k2) {
      text(k2, -0.3, String(k2).replace("-", "−"), C.neutral);
      text(-0.34, k2, String(k2).replace("-", "−"), C.neutral);
    }
    var chain = [
      function (p) { return p; },
      function (p) { return mv(m.VT, p); },
      function (p) { return mv(m.S, mv(m.VT, p)); },
      function (p) { return mv(m.U, mv(m.S, mv(m.VT, p))); }
    ];
    var f = chain[step];
    var circ = [], cur = [];
    for (var t = 0; t <= 160; t++) {
      var a = t / 160 * 2 * Math.PI, p = [Math.cos(a), Math.sin(a)];
      circ.push(p); cur.push(f(p));
    }
    path(circ, C.input, 1.5, "5 4");
    path(cur, C.output, 2.4);
    var v1 = [Math.cos(thV), Math.sin(thV)], v2 = [-Math.sin(thV), Math.cos(thV)];
    var a1 = f(v1), a2 = f(v2);
    arrow(a1, C.comp1, 3.4);
    arrow(a2, C.comp2, 3.4);

    var what = ["还没有乘任何矩阵：长度为 1 的全部向量，端点组成单位圆",
                "乘 Vᵀ：整个圆转了一个角度。<br>橙色箭头转到 " + vs([1, 0]) +
                "，青色箭头转到 " + vs([0, 1]) + "。",
                "再乘 Σ：横坐标乘 σ₁、纵坐标乘 σ₂，圆被拉成两轴沿坐标轴的椭圆",
                "再乘 U：整条椭圆转到最后的位置，橙色箭头落在 u₁ 的方向上"][step];
    document.getElementById("what").innerHTML = what;
    document.getElementById("a1").innerHTML = vs(a1);
    document.getElementById("a2").innerHTML = vs(a2);
    document.getElementById("r1v").textContent = fmt(m.s[0], 1);
    document.getElementById("r2v").textContent = fmt(m.s[1], 1);
    var ids = [["u11", m.U[0][0]], ["u12", m.U[0][1]], ["u21", m.U[1][0]], ["u22", m.U[1][1]],
               ["v11", m.VT[0][0]], ["v12", m.VT[0][1]], ["v21", m.VT[1][0]], ["v22", m.VT[1][1]]];
    ids.forEach(function (r) { document.getElementById(r[0]).textContent = fmt(r[1]); });
    document.getElementById("g11").textContent = fmt(m.s[0], 1);
    document.getElementById("g22").textContent = fmt(m.s[1], 1);
    document.getElementById("angV").textContent = fmt(-thV * 180 / Math.PI, 3) + "°";
    document.getElementById("angU").textContent = fmt(thU * 180 / Math.PI, 3) + "°";
    var P = mm(mm(m.U, m.S), m.VT);
    document.getElementById("p11").textContent = fmt(P[0][0]);
    document.getElementById("p12").textContent = fmt(P[0][1]);
    document.getElementById("p21").textContent = fmt(P[1][0]);
    document.getElementById("p22").textContent = fmt(P[1][1]);
    var dt = P[0][0] * P[1][1] - P[0][1] * P[1][0];
    document.getElementById("chk1").textContent = fmt(m.s[0] * m.s[1]) + "　" + fmt(Math.abs(dt));
    var sq = P[0][0] * P[0][0] + P[0][1] * P[0][1] + P[1][0] * P[1][0] + P[1][1] * P[1][1];
    document.getElementById("chk2").textContent =
      fmt(m.s[0] * m.s[0] + m.s[1] * m.s[1]) + "　" + fmt(sq);
  }

  [0, 1, 2, 3].forEach(function (k) {
    document.getElementById("s" + k).onclick = function () {
      step = k;
      [0, 1, 2, 3].forEach(function (j) {
        document.getElementById("s" + j).className = j === k ? "on" : "";
      });
      draw();
    };
  });
  function clamp() {
    var r1 = document.getElementById("r1"), r2 = document.getElementById("r2");
    if (+r2.value > +r1.value) r2.value = r1.value;
    draw();
  }
  document.getElementById("r1").addEventListener("input", clamp);
  document.getElementById("r2").addEventListener("input", clamp);
  document.getElementById("pB").onclick = function () {
    document.getElementById("r1").value = 4;
    document.getElementById("r2").value = 1;
    draw();
  };
  draw();
})();
</script>
</body>
</html>
