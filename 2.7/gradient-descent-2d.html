<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梯度下降的路径</title>
<style>
  :root{
    --input:#2F6FE0; --comp1:#E8743B; --comp2:#0E96B8; --output:#8E44AD;
    --state:#E9A913; --bad:#D64545; --good:#3E9B3A; --neutral:#9AA6B6;
    --light:#E7ECF3; --bg:#FFFFFF; --text:#1F2937;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:var(--bg);color:var(--text);
       font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:15px;line-height:1.7}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:21px;margin:0 0 6px}
  .lead{color:#55606e;margin:0 0 18px}
  .panel{border:1px solid var(--light);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
  .cols > .panel{flex:1 1 420px;margin-bottom:0}
  .row{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:12px}
  .row:last-child{margin-bottom:0}
  label{min-width:92px;color:#55606e}
  input[type=range]{flex:1 1 220px;min-width:180px;accent-color:var(--input)}
  .val{font-family:"Cambria Math","Times New Roman",serif;font-size:17px;min-width:92px}
  button{border:1px solid var(--neutral);background:#fff;color:var(--text);
         border-radius:7px;padding:5px 12px;font-size:14px;cursor:pointer;font-family:inherit}
  button:hover{background:var(--light)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--light);padding:6px 9px;text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{background:#f5f7fa;font-weight:600}
  td.num{font-family:"Cambria Math","Times New Roman",serif;font-size:15px}
  tr.now td{background:#f3edf8;font-weight:600}
  .big{font-size:17px}
  .ok{color:var(--good)} .no{color:var(--bad)}
  .note{color:#55606e;font-size:14px;margin-top:10px}
  svg{display:block;width:100%;height:auto}
  sub{font-size:0.75em}
</style>
</head>
<body>
<div class="wrap">

<h1>梯度下降的路径</h1>
<p class="lead">误差 L(w<sub>1</sub>, w<sub>2</sub>) = w<sub>1</sub>² + w<sub>1</sub>w<sub>2</sub> + 2w<sub>2</sub>²。拖动学习率和起点，看每一步挪到哪里、误差变成多少。</p>

<div class="panel">
  <div class="row">
    <label>学习率 η</label>
    <input type="range" id="eta" min="0.02" max="0.60" step="0.01" value="0.10">
    <span class="val">η = <b id="eta-v">0.10</b></span>
    <button data-eta="0.1">0.1</button>
    <button data-eta="0.3">0.3</button>
    <button data-eta="0.45">0.45</button>
    <button data-eta="0.5">0.5</button>
  </div>
  <div class="row">
    <label>起点 w<sub>1</sub></label>
    <input type="range" id="x0" min="-2" max="2" step="0.05" value="1">
    <span class="val">w<sub>1</sub> = <b id="x0-v">1.00</b></span>
  </div>
  <div class="row">
    <label>起点 w<sub>2</sub></label>
    <input type="range" id="y0" min="-2" max="2" step="0.05" value="1">
    <span class="val">w<sub>2</sub> = <b id="y0-v">1.00</b></span>
  </div>
  <div class="row">
    <label>走到第几步</label>
    <input type="range" id="step" min="0" max="12" step="1" value="2">
    <span class="val">第 <b id="step-v">2</b> 步</span>
    <button id="back">上一步</button>
    <button id="next">下一步</button>
    <button id="reset">回到起点</button>
  </div>
</div>

<div class="cols">
  <div class="panel">
    <svg id="plot" viewBox="0 0 560 590" xmlns="http://www.w3.org/2000/svg"></svg>
    <p class="note">灰色是等高线，紫色是走过的路线，橙色箭头是从当前位置再挪出去的 −η∇L。</p>
  </div>
  <div class="panel">
    <table>
      <tr><th>名目</th><th>数值</th></tr>
      <tr><td>当前位置 w<sub>1</sub></td><td class="num big" id="cx"></td></tr>
      <tr><td>当前位置 w<sub>2</sub></td><td class="num big" id="cy"></td></tr>
      <tr><td>误差 L</td><td class="num big" id="cl"></td></tr>
      <tr><td>梯度第一个分量 2w<sub>1</sub> + w<sub>2</sub></td><td class="num" id="g1"></td></tr>
      <tr><td>梯度第二个分量 w<sub>1</sub> + 4w<sub>2</sub></td><td class="num" id="g2"></td></tr>
      <tr><td>再走一步 w<sub>1</sub> 要减掉</td><td class="num" id="d1"></td></tr>
      <tr><td>再走一步 w<sub>2</sub> 要减掉</td><td class="num" id="d2"></td></tr>
    </table>
    <p class="note" id="verdict"></p>
    <table style="margin-top:12px">
      <tr><th>步</th><th>w<sub>1</sub></th><th>w<sub>2</sub></th><th>L</th></tr>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

</div>

<script>
var PAL = {input:"#2F6FE0", comp1:"#E8743B", output:"#8E44AD", neutral:"#9AA6B6",
           light:"#E7ECF3", text:"#1F2937", bad:"#D64545", good:"#3E9B3A"};
var NSTEP = 12;
// 学习率的上限 2 / (3 + √2)：3 ± √2 是海森矩阵 [2 1; 1 4] 的两个特征值
var ETA_MAX = 2 / (3 + Math.sqrt(2));

function L(x, y){ return x*x + x*y + 2*y*y; }
function grad(x, y){ return [2*x + y, x + 4*y]; }

function fmt(v, nd){
  if (!isFinite(v)) return "超出范围";
  var a = Math.abs(v);
  if (a >= 1e6) return v.toExponential(3).replace("-", "−");
  var s = v.toFixed(nd === undefined ? 4 : nd);
  if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
  if (s === "-0") s = "0";
  return s.replace("-", "−");
}

function path(eta, x, y){
  var out = [[x, y, L(x, y)]];
  for (var k = 0; k < NSTEP; k++){
    var g = grad(x, y);
    x = x - eta * g[0];
    y = y - eta * g[1];
    out.push([x, y, L(x, y)]);
  }
  return out;
}

// ---------------- 画图 ----------------
var R = 2.4, W = 560, H = 590, OX = 280, OY = 262, U = 106;
var BOT = OY + R * U;          // 画框的下边，提示和图例都写在它下面
function px(x, y){ return [OX + U * x, OY - U * y]; }

function el(name, attrs, text){
  var e = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}

function contour(c){
  var pts = [];
  for (var i = 0; i <= 240; i++){
    var th = 2 * Math.PI * i / 240;
    var cx = Math.cos(th), sy = Math.sin(th);
    var r = Math.sqrt(c / L(cx, sy));
    pts.push([r * cx, r * sy]);
  }
  pts.push(pts[0]);
  // 只保留画得下的那几段
  var segs = [], run = [];
  for (var j = 0; j < pts.length; j++){
    var p = pts[j];
    if (Math.abs(p[0]) <= R && Math.abs(p[1]) <= R) run.push(p);
    else { if (run.length > 1) segs.push(run); run = []; }
  }
  if (run.length > 1) segs.push(run);
  return segs;
}

function draw(pts, k, eta){
  var svg = document.getElementById("plot");
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  var i;
  for (i = -2; i <= 2; i++){
    if (i === 0) continue;
    svg.appendChild(el("line", {x1:px(i,-R)[0], y1:px(i,-R)[1], x2:px(i,R)[0], y2:px(i,R)[1],
                                stroke:PAL.light, "stroke-width":1}));
    svg.appendChild(el("line", {x1:px(-R,i)[0], y1:px(-R,i)[1], x2:px(R,i)[0], y2:px(R,i)[1],
                                stroke:PAL.light, "stroke-width":1}));
  }
  svg.appendChild(el("line", {x1:px(-R,0)[0], y1:px(-R,0)[1], x2:px(R,0)[0], y2:px(R,0)[1],
                              stroke:PAL.neutral, "stroke-width":1.4}));
  svg.appendChild(el("line", {x1:px(0,-R)[0], y1:px(0,-R)[1], x2:px(0,R)[0], y2:px(0,R)[1],
                              stroke:PAL.neutral, "stroke-width":1.4}));
  svg.appendChild(el("text", {x:W-16, y:OY-8, fill:PAL.text, "font-size":14, "text-anchor":"end"}, "w₁"));
  svg.appendChild(el("text", {x:OX+8, y:16, fill:PAL.text, "font-size":14}, "w₂"));

  var levels = [0.25, 1, 2.5, 5, 9];
  for (i = 0; i < levels.length; i++){
    var segs = contour(levels[i]);
    for (var s = 0; s < segs.length; s++){
      var d = "M " + segs[s].map(function(p){ var q = px(p[0], p[1]); return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L ");
      svg.appendChild(el("path", {d:d, fill:"none", stroke:PAL.neutral, "stroke-width":1.1, opacity:0.55}));
    }
  }
  svg.appendChild(el("circle", {cx:px(0,0)[0], cy:px(0,0)[1], r:5, fill:PAL.good}));

  // 跑出画面的那一段不画：画到边框上为止，后面的点和线都不画
  function inside(p){ return Math.abs(p[0]) <= R && Math.abs(p[1]) <= R; }
  function toEdge(a, b){        // a 在画面里、b 在画面外：二分找边框上的那一点
    var lo = 0, hi = 1, m, p;
    for (var t = 0; t < 24; t++){
      m = (lo + hi) / 2;
      p = [a[0] + (b[0]-a[0])*m, a[1] + (b[1]-a[1])*m];
      if (inside(p)) lo = m; else hi = m;
    }
    return [a[0] + (b[0]-a[0])*lo, a[1] + (b[1]-a[1])*lo];
  }
  function seg(a, b, color, w){
    var qa = px(a[0], a[1]), qb = px(b[0], b[1]);
    svg.appendChild(el("line", {x1:qa[0], y1:qa[1], x2:qb[0], y2:qb[1],
                                stroke:color, "stroke-width":w, opacity:0.9}));
    return qb;
  }
  var gone = false;             // 有没有哪一步跑出过画面
  for (i = 0; i < k; i++){
    var a = pts[i], b = pts[i+1], ain = inside(a), bin = inside(b);
    if (ain && bin){
      var qb = seg(a, b, PAL.output, 2.2);
      svg.appendChild(el("circle", {cx:qb[0], cy:qb[1], r:3.5, fill:PAL.output}));
    } else if (ain){            // 从框内跑出去：画到边框为止
      seg(a, toEdge(a, b), PAL.output, 2.2);
      gone = true;
    } else if (bin){            // 从框外回到框里：从边框画起
      var qb2 = seg(toEdge(b, a), b, PAL.output, 2.2);
      svg.appendChild(el("circle", {cx:qb2[0], cy:qb2[1], r:3.5, fill:PAL.output}));
      gone = true;
    } else {                    // 两端都在框外：这一步整段不画
      gone = true;
    }
  }
  var cur = pts[k], out = !inside(cur);
  if (!out){
    var qc = px(cur[0], cur[1]);
    if (k < NSTEP){
      var nx = pts[k+1], end = inside(nx) ? nx : toEdge(cur, nx);
      var qn = seg(cur, end, PAL.comp1, 2.6);
      var ang = Math.atan2(qn[1]-qc[1], qn[0]-qc[0]);
      if (Math.hypot(qn[0]-qc[0], qn[1]-qc[1]) > 10 && inside(nx)){
        svg.appendChild(el("polygon", {
          points:[qn[0], qn[1], qn[0] - 11*Math.cos(ang-0.4), qn[1] - 11*Math.sin(ang-0.4),
                  qn[0] - 11*Math.cos(ang+0.4), qn[1] - 11*Math.sin(ang+0.4)].join(" "),
          fill:PAL.comp1}));
      }
    }
    svg.appendChild(el("circle", {cx:qc[0], cy:qc[1], r:6.5, fill:PAL.output}));
  }
  if (out || gone){
    svg.appendChild(el("text", {x:OX, y:BOT+30, fill:PAL.bad, "font-size":14, "text-anchor":"middle"},
                       out ? "当前位置已经跑出画面，线只画到边框为止"
                           : "有几步跑出了画面，那几段只画到边框为止"));
  }
  svg.appendChild(el("text", {x:OX, y:BOT+56, fill:PAL.neutral, "font-size":13,
                              "text-anchor":"middle"}, "等高线：L = 0.25、1、2.5、5、9"));
}

// ---------------- 刷新 ----------------
function refresh(){
  var eta = parseFloat(document.getElementById("eta").value);
  var x0 = parseFloat(document.getElementById("x0").value);
  var y0 = parseFloat(document.getElementById("y0").value);
  var k = parseInt(document.getElementById("step").value, 10);
  document.getElementById("eta-v").textContent = eta.toFixed(2);
  document.getElementById("x0-v").textContent = x0.toFixed(2);
  document.getElementById("y0-v").textContent = y0.toFixed(2);
  document.getElementById("step-v").textContent = k;

  var pts = path(eta, x0, y0);
  var cur = pts[k], g = grad(cur[0], cur[1]);
  document.getElementById("cx").textContent = fmt(cur[0]);
  document.getElementById("cy").textContent = fmt(cur[1]);
  document.getElementById("cl").textContent = fmt(cur[2], 6);
  document.getElementById("g1").textContent = fmt(g[0]);
  document.getElementById("g2").textContent = fmt(g[1]);
  document.getElementById("d1").textContent = fmt(eta * g[0]);
  document.getElementById("d2").textContent = fmt(eta * g[1]);

  var v = document.getElementById("verdict");
  if (x0 === 0 && y0 === 0){
    v.innerHTML = "起点就在最低点，梯度是零向量，再走也不动了。";
  } else if (eta < ETA_MAX){
    v.innerHTML = "<span class='ok'>η 小于 " + ETA_MAX.toFixed(6) +
                  "，误差一步比一步小，一直走下去会越来越靠近 (0, 0)。</span>";
  } else {
    v.innerHTML = "<span class='no'>η 不小于 " + ETA_MAX.toFixed(6) +
                  "，步子跨过了谷底，误差会越来越大。</span>";
  }

  var rows = document.getElementById("rows");
  while (rows.firstChild) rows.removeChild(rows.firstChild);
  for (var i = 0; i <= NSTEP; i++){
    var tr = document.createElement("tr");
    if (i === k) tr.className = "now";
    var cells = [String(i), fmt(pts[i][0]), fmt(pts[i][1]), fmt(pts[i][2], 6)];
    for (var j = 0; j < 4; j++){
      var td = document.createElement("td");
      if (j > 0) td.className = "num";
      td.textContent = cells[j];
      tr.appendChild(td);
    }
    rows.appendChild(tr);
  }
  draw(pts, k, eta);
}

["eta", "x0", "y0", "step"].forEach(function(id){
  document.getElementById(id).addEventListener("input", refresh);
});
document.getElementById("next").addEventListener("click", function(){
  var s = document.getElementById("step");
  s.value = Math.min(NSTEP, parseInt(s.value, 10) + 1);
  refresh();
});
document.getElementById("back").addEventListener("click", function(){
  var s = document.getElementById("step");
  s.value = Math.max(0, parseInt(s.value, 10) - 1);
  refresh();
});
document.getElementById("reset").addEventListener("click", function(){
  document.getElementById("step").value = 0;
  refresh();
});
var btns = document.querySelectorAll("button[data-eta]");
for (var b = 0; b < btns.length; b++){
  btns[b].addEventListener("click", function(){
    document.getElementById("eta").value = this.getAttribute("data-eta");
    refresh();
  });
}
refresh();
</script>
</body>
</html>
