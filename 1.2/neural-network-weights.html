<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神经网络与权重矩阵</title>
<style>
  :root {
    --input: #2F6FE0; --comp1: #E8743B; --comp2: #0E96B8; --output: #8E44AD;
    --state: #E9A913; --bad: #D64545; --good: #3E9B3A; --neutral: #9AA6B6;
    --light: #E7ECF3; --bg: #FFFFFF; --text: #1F2937;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 15px; }
  main { display: flex; gap: 24px; padding: 20px; flex-wrap: wrap; align-items: flex-start; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: #5b6573; font-size: 13px; margin: 0 0 12px; }
  svg { border: 1px solid var(--light); border-radius: 8px; }
  .panel { flex: 1; min-width: 360px; max-width: 520px; }
  .card { border: 1px solid var(--light); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; gap: 8px; }
  .num { font-family: "Cambria Math", "Times New Roman", serif; font-size: 17px; }
  .colvec { display: inline-flex; flex-direction: column; align-items: center;
            position: relative; padding: 2px 10px; line-height: 1.25;
            vertical-align: middle;
            font-family: "Cambria Math", "Times New Roman", serif; }
  .colvec::before, .colvec::after { content: ""; position: absolute; top: 0; bottom: 0;
            width: 5px; border: 1.5px solid currentColor; }
  .colvec::before { left: 0; border-right: none; }
  .colvec::after { right: 0; border-left: none; }
  .x { color: var(--input); } .r1 { color: var(--comp1); } .r2 { color: var(--comp2); }
  input[type=range] { width: 200px; }
  table.m { border-collapse: collapse; font-family: "Cambria Math", serif; font-size: 19px;
            border-left: 2px solid var(--text); border-right: 2px solid var(--text); }
  table.m td { padding: 2px 4px; text-align: center; border-radius: 4px; }
  table.m td.on { outline: 2px solid var(--text); background: #FFF6DA; }
  .wi { width: 58px; font: 17px "Cambria Math", serif; text-align: center; border: 1px solid transparent; background: transparent; }
  .wi:hover, .wi:focus { border-color: var(--neutral); }
  .colhead { font-size: 12px; color: var(--neutral); text-align: center; }
  math { font-size: 17px; }
</style>
</head>
<body>
<main>
  <div>
    <h1>神经网络与权重矩阵</h1>
    <p class="hint">把鼠标移到一条连接上，权重矩阵里对应的元素会亮起；移到矩阵元素上，对应的连接会亮起。矩阵里的权重可以直接改。</p>
    <svg id="net" width="560" height="420" viewBox="0 0 560 420"></svg>
  </div>
  <div class="panel">
    <div class="card">
      <div class="row"><span>输入 <span class="x">x₁</span></span><input type="range" id="x1" min="-3" max="3" step="0.1" value="0.5"><span class="num x" id="x1v"></span></div>
      <div class="row"><span>输入 <span class="x">x₂</span></span><input type="range" id="x2" min="-3" max="3" step="0.1" value="-1"><span class="num x" id="x2v"></span></div>
      <div class="row"><span>输入 <span class="x">x₃</span></span><input type="range" id="x3" min="-3" max="3" step="0.1" value="2"><span class="num x" id="x3v"></span></div>
    </div>
    <div class="card">
      <div class="row"><b>W</b> =
        <table class="m" id="W"></table></div>
      <p class="hint" style="margin:6px 0 0">第 i 行第 j 列的元素 w<sub>ij</sub>：从第 j 个输入到第 i 个输出的连接。</p>
    </div>
    <div class="card">
      <div>按行算（每个输出神经元一次点积）：</div>
      <div class="num r1" id="y1"></div>
      <div class="num r2" id="y2"></div>
      <div style="margin-top:8px">按列算（每个输入沿自己的连接送出）：</div>
      <div class="num" id="cols"></div>
      <math display="block"><mrow><mi mathvariant="bold">y</mi><mo>=</mo><mi mathvariant="bold">W</mi><mi mathvariant="bold">x</mi></mrow></math>
    </div>
  </div>
</main>
<script>
(function () {
  "use strict";
  var C = { input: "#2F6FE0", r: ["#E8743B", "#0E96B8"], text: "#1F2937" };
  var NS = "http://www.w3.org/2000/svg", svg = document.getElementById("net");
  var W = [[0.2, 0.4, 0.1], [0.5, -0.3, 0.2]];
  var IN = [[90, 80], [90, 210], [90, 340]], OUT = [[440, 140], [440, 280]];
  var edges = [], hiEdge = null;
  function fmt(v) {
    var s = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(3);
    if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
    return s.replace("-", "−");
  }
  function par(v) { return v < 0 ? "(" + fmt(v) + ")" : fmt(v); }
  // 列向量竖写：用一对 CSS 画出来的方括号
  function cv(v) {
    return '<span class="colvec"><span>' + fmt(v[0]) + "</span><span>" + fmt(v[1]) + "</span></span>";
  }
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e); return e;
  }
  for (var i = 0; i < 2; i++) for (var j = 0; j < 3; j++) {
    var a = IN[j], b = OUT[i];
    var line = el("line", { x1: a[0] + 26, y1: a[1], x2: b[0] - 26, y2: b[1], stroke: C.r[i], "stroke-width": 2.5, "stroke-opacity": 0.75 });
    var hit = el("line", { x1: a[0] + 26, y1: a[1], x2: b[0] - 26, y2: b[1], stroke: "transparent", "stroke-width": 14,
                           style: "cursor:pointer", "data-i": i, "data-j": j });
    var t = 0.78, lx = a[0] + 26 + (b[0] - a[0] - 52) * t, ly = a[1] + (b[1] - a[1]) * t;
    var bg = el("rect", { x: lx - 20, y: ly - 9, width: 40, height: 18, rx: 4, fill: "#fff", "fill-opacity": 0.9 });
    var lab = el("text", { x: lx, y: ly + 5, "font-size": 12, "text-anchor": "middle", fill: C.r[i], "font-family": "Cambria Math, serif" });
    edges.push({ i: i, j: j, line: line, lab: lab, bg: bg });
    hit.addEventListener("mouseenter", function () { setHi(+this.getAttribute("data-i"), +this.getAttribute("data-j")); });
    hit.addEventListener("mouseleave", function () { setHi(null); });
  }
  var inT = [], outT = [];
  IN.forEach(function (p, j) {
    el("circle", { cx: p[0], cy: p[1], r: 26, fill: "#fff", stroke: C.input, "stroke-width": 2 });
    inT.push(el("text", { x: p[0], y: p[1] + 6, "font-size": 16, "text-anchor": "middle", fill: C.input, "font-family": "Cambria Math, serif" }));
    var n = el("text", { x: p[0] - 46, y: p[1] + 5, "font-size": 14, "text-anchor": "middle", fill: C.input, "font-style": "italic" });
    n.textContent = "x" + "₁₂₃"[j];
  });
  OUT.forEach(function (p, i) {
    el("circle", { cx: p[0], cy: p[1], r: 28, fill: "#fff", stroke: C.r[i], "stroke-width": 2.4 });
    outT.push(el("text", { x: p[0], y: p[1] + 6, "font-size": 15, "text-anchor": "middle", fill: C.r[i], "font-family": "Cambria Math, serif" }));
    var n = el("text", { x: p[0] + 50, y: p[1] + 5, "font-size": 14, "text-anchor": "middle", fill: C.r[i], "font-style": "italic" });
    n.textContent = "y" + "₁₂"[i];
  });
  var tab = document.getElementById("W");
  var head = "<tr>"; for (var jj = 0; jj < 3; jj++) head += '<td class="colhead">输入 ' + (jj + 1) + "</td>"; head += "</tr>";
  var body = "";
  for (var ii = 0; ii < 2; ii++) {
    body += "<tr>";
    for (var j2 = 0; j2 < 3; j2++) body += '<td data-i="' + ii + '" data-j="' + j2 + '"><input class="wi" style="color:' + C.r[ii] +
      '" id="w' + ii + j2 + '" value="' + W[ii][j2] + '"></td>';
    body += "</tr>";
  }
  tab.innerHTML = body + head;
  Array.prototype.forEach.call(tab.querySelectorAll("td[data-i]"), function (td) {
    td.addEventListener("mouseenter", function () { setHi(+td.getAttribute("data-i"), +td.getAttribute("data-j")); });
    td.addEventListener("mouseleave", function () { setHi(null); });
    td.querySelector("input").addEventListener("input", function () {
      var v = parseFloat(this.value); W[+td.getAttribute("data-i")][+td.getAttribute("data-j")] = isFinite(v) ? v : 0; update();
    });
  });
  function setHi(i, j) {
    hiEdge = i === null ? null : [i, j];
    edges.forEach(function (e) {
      var on = hiEdge && e.i === hiEdge[0] && e.j === hiEdge[1];
      e.line.setAttribute("stroke-width", on ? 6 : 2.5);
      e.line.setAttribute("stroke-opacity", hiEdge ? (on ? 1 : 0.2) : 0.75);
      e.lab.setAttribute("font-weight", on ? "bold" : "normal");
    });
    Array.prototype.forEach.call(tab.querySelectorAll("td[data-i]"), function (td) {
      td.classList.toggle("on", !!hiEdge && +td.getAttribute("data-i") === hiEdge[0] && +td.getAttribute("data-j") === hiEdge[1]);
    });
  }
  function update() {
    var x = [1, 2, 3].map(function (k) { return parseFloat(document.getElementById("x" + k).value); });
    x.forEach(function (v, k) { document.getElementById("x" + (k + 1) + "v").textContent = fmt(v); inT[k].textContent = fmt(v); });
    var y = W.map(function (r) { return r[0] * x[0] + r[1] * x[1] + r[2] * x[2]; });
    edges.forEach(function (e) { e.lab.textContent = fmt(W[e.i][e.j]); });
    y.forEach(function (v, i) {
      outT[i].textContent = fmt(v);
      document.getElementById("y" + (i + 1)).textContent = "y" + "₁₂"[i] + " = " + W[i].map(function (w, k) { return par(w) + " × " + par(x[k]); }).join(" + ") + " = " + fmt(v);
    });
    document.getElementById("cols").innerHTML = x.map(function (v, k) { return par(v) + " × " + cv([W[0][k], W[1][k]]); }).join(" + ") +
      " = " + cv(y);
  }
  [1, 2, 3].forEach(function (k) { document.getElementById("x" + k).addEventListener("input", update); });
  update();
})();
</script>
</body>
</html>
